name: CD
# Push images to DockerHub after CI is green on main, and for release tags (US-25).
# Needs GitHub secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (access token - never your password).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

jobs:
  push:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    name: push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: client,  context: client,   file: client/Dockerfile }
          - { name: gateway, context: gateway,  file: gateway/Dockerfile }
          - { name: ml,      context: services, file: services/ml_service/Dockerfile }
          - { name: dl,      context: services, file: services/dl_service/Dockerfile }
          - { name: qml,     context: services, file: services/qml_service/Dockerfile }
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rdcp-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', env.IMAGE, github.ref_name) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
