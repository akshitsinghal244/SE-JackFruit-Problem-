# TEMPLATE ONLY - do not commit real values. `deploy.sh` creates the real secret with random values:
#   kubectl -n rdcp create secret generic rdcp-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) --from-literal=SERVICE_API_KEY=$(openssl rand -hex 32) \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 16) --from-literal=ADMIN_PASSWORD='<strong password>'
apiVersion: v1
kind: Secret
metadata: { name: rdcp-secrets, namespace: rdcp }
type: Opaque
stringData:
  JWT_SECRET: "<random 64 hex chars>"
  SERVICE_API_KEY: "<random 64 hex chars>"
  POSTGRES_PASSWORD: "<random 32 hex chars>"
  ADMIN_PASSWORD: "<strong password>"
