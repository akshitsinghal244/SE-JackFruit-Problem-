# 3-node local cluster so replicas land on different nodes:  mkdir -p services/artifacts/{ml,dl,qml}; kind create cluster --name rdcp --config k8s/kind-cluster.yaml
# Calico (or Cilium) is required for NetworkPolicy enforcement; kind's default CNI ignores policies (see README).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking: { disableDefaultCNI: true, podSubnet: 192.168.0.0/16 }
nodes:
  - role: control-plane
    kubeadmConfigPatches: ["kind: InitConfiguration\nnodeRegistration:\n  kubeletExtraArgs:\n    node-labels: \"ingress-ready=true\""]
    extraPortMappings: [{ containerPort: 80, hostPort: 80 }, { containerPort: 443, hostPort: 443 }]
    extraMounts: [{ hostPath: ./services/artifacts, containerPath: /artifacts, readOnly: true }]   # trained model files, read-only
  - role: worker
    extraMounts: [{ hostPath: ./services/artifacts, containerPath: /artifacts, readOnly: true }]
  - role: worker
    extraMounts: [{ hostPath: ./services/artifacts, containerPath: /artifacts, readOnly: true }]
